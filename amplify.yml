version: 1
applications:
  - appRoot: admin-web
    frontend:
      phases:
        preBuild:
          commands:
            - cd .. && npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*

  - appRoot: kiosk-app
    frontend:
      phases:
        preBuild:
          commands:
            - cd .. && npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
